# The single external entry point. NGINX ingress routes all HTTP to the UI
# Service; the UI then calls the API over the internal network (api:8000), so the
# API itself needs no public exposure. Reachable at http://localhost:8080 (the
# kind cluster maps host 8080 → the ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scholarrag
  namespace: scholarrag
  labels:
    app.kubernetes.io/name: scholarrag
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8501
