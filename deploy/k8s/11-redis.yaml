# Redis as a Deployment — here it's a cache/broker whose data we can afford to
# lose on restart, so no persistent volume (unlike Postgres). A normal ClusterIP
# Service gives it a stable in-cluster address at redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scholarrag
  labels:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: scholarrag
  labels:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarrag
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarrag
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
