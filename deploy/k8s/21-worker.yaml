# The Celery ingestion worker — SAME image as the API, different command (one
# image, three roles). No Service: nothing calls it over the network; it pulls
# tasks from Redis. No HTTP probes for the same reason.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: scholarrag
  labels:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarrag
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarrag
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: scholarrag-api:latest
          imagePullPolicy: IfNotPresent
          command:
            ["celery", "-A", "scholarrag.workers.celery_app", "worker", "-l", "info", "--concurrency", "2"]
          envFrom:
            - configMapRef:
                name: scholarrag-config
            - secretRef:
                name: scholarrag-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi" # ingestion loads the BGE model to embed chunks
