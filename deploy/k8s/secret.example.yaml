# REFERENCE ONLY — do NOT `kubectl apply` this file (it's all comments, so a
# `kubectl apply -f deploy/k8s/` is a harmless no-op on it). The real Secret
# holds credentials and must never be committed.
#
# For local kind, create it straight from your .env — this is what `make
# k8s-secret` runs:
#
#   kubectl -n scholarrag create secret generic scholarrag-secrets \
#     --from-literal=GEMINI_API_KEY="$(grep -E '^GEMINI_API_KEY=' .env | cut -d= -f2-)" \
#     --from-literal=PINECONE_API_KEY="$(grep -E '^PINECONE_API_KEY=' .env | cut -d= -f2-)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The equivalent manifest form (values must be filled in — never commit real ones):
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: scholarrag-secrets
#     namespace: scholarrag
#   type: Opaque
#   stringData:
#     GEMINI_API_KEY: "your-key-here"
#     PINECONE_API_KEY: "your-key-here"
#
# Pods pull this in via `envFrom: [{ secretRef: { name: scholarrag-secrets } }]`,
# exactly like the ConfigMap — Kubernetes merges both into the container's env.
