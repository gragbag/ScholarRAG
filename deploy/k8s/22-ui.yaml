# The Streamlit UI — SAME image, Streamlit command. Reaches the API by its
# in-cluster Service DNS (http://api:8000), NOT localhost. Streamlit ships its
# own health endpoint at /_stcore/health, which we use for the probes.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: scholarrag
  labels:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: ui
spec:
  selector:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: ui
  ports:
    - port: 8501
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: scholarrag
  labels:
    app.kubernetes.io/name: scholarrag
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scholarrag
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scholarrag
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: scholarrag-api:latest
          imagePullPolicy: IfNotPresent
          command:
            ["streamlit", "run", "src/scholarrag/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
          ports:
            - containerPort: 8501
          env:
            # In-cluster service DNS — the k8s echo of the compose-networking fix.
            - name: SCHOLARRAG_API_URL
              value: "http://api:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi" # the UI process is just Streamlit + httpx (no torch)
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 15
